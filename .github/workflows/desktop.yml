# Genie 1 desktop — build macOS, Windows and Linux from one source, in one run.
#
# WHY THIS EXISTS: the three download buttons on xearn.com resolve through /api/download, which
# asks the GitHub releases API for an asset matching the caller's platform. Until a release
# carries all three, two of those buttons honestly answer 503 — so the buttons are not blocked on
# the website, they are blocked on these artifacts. A Mac cannot cross-compile the other two.
#
# Trigger it by pushing a v* tag, or by hand from the Actions tab against an existing tag.
name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

# ONE RUN PER TAG. Without this, re-dispatching while a run is in flight leaves two runs racing
# to attach assets to the same release — and the loser reports a failure for work that actually
# succeeded, which is how a "all jobs have failed" email arrives for a build that shipped.
concurrency:
  group: desktop-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  # PINNED, NOT A RANGE. This was `--version "^2"`, which resolves to whatever the newest 2.x
  # is on the morning of the run — so a CLI release nobody here chose could break a build that
  # passed yesterday, with nothing in this repo having changed. A pin fails only when we move it.
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  build:
    strategy:
      # fail-fast off, deliberately: one platform failing to compile should still land the other
      # two. A release with two of three working beats a release with none.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # UBUNTU 24.04, NOT 22.04. GitHub's runner-images announcement: "The Ubuntu 22 based
          # runner images will begin deprecation on September 17th and will be fully unsupported
          # by April 17th." Pinning to a retiring image is a build that is going to fail on a
          # date nobody is watching for.
          #
          # The cost is glibc: 24.04 links against 2.39, so the AppImage this produces needs a
          # distro at least that new. That is the trade the retirement forces, and it is better
          # to make it deliberately now than to discover it when the image disappears.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    # A hung compile otherwise sits on a runner until GitHub's 6-hour ceiling. These builds take
    # about 13 minutes; 45 is generous and still ends a stuck job the same day.
    timeout-minutes: 45
    steps:
      # BUILD FROM THE BRANCH, UPLOAD TO THE TAG. The first run checked out the tag it was
      # asked to attach to — and that tag was cut BEFORE the app source existed, so every job
      # died with "working directory app/tauri: no such file or directory" on all three
      # platforms at once. A release tag names where the artifacts GO; it is not necessarily
      # where the code to build them lives. On a tag push these are the same commit anyway.
      - uses: actions/checkout@v4

      # FAIL ON A TYPO'D TAG HERE, WITH A SENTENCE THAT SAYS SO. Left to the upload step, a tag
      # that does not exist is CREATED — so a mistyped dispatch quietly publishes a new empty
      # release instead of attaching to the intended one, and nothing looks wrong until someone
      # goes looking for the download.
      - name: Check the target tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ github.event.inputs.tag }}
        run: |
          if ! gh release view "$WANT" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No release tagged '$WANT'. Create it first, or dispatch against an existing tag."
            exit 1
          fi
          echo "attaching to $WANT"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
                                  patchelf libssl-dev build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The macOS job needs BOTH arches present or the universal build fails at the lipo step
          # with a target that was never compiled.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/tauri

      # CACHE THE CLI BINARY, NOT JUST THE PROJECT. rust-cache covers app/tauri's dependencies
      # and not ~/.cargo/bin, so `cargo install tauri-cli` recompiled the whole CLI from source
      # on every job of every run — two to four minutes each, three times over, and a network
      # round trip to crates.io that only has to be unreachable once to fail a build for reasons
      # that have nothing to do with the code.
      - name: Cache tauri-cli
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}

      - name: Install tauri-cli
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build
        working-directory: app/tauri
        run: cargo tauri build ${{ matrix.args }}

      # Collected by extension rather than by exact filename: Tauri's bundle names carry the
      # version and the arch, so a hardcoded path silently stops matching on the next bump and
      # the upload step finds nothing while still reporting success.
      # COLLECT FROM THE BUNDLE DIRECTORY ONLY.
      # The first successful run searched the whole target tree for *.exe and attached FORTY-FIVE
      # files to the release: every Rust build-script intermediate under target/release/build/,
      # plus the bare genie1.exe, which is the binary and not something anyone can install.
      # Excluding */deps/* was not enough, because build scripts do not live in deps.
      #
      # Tauri writes what it BUNDLES to one place. Take it from there and the question of what
      # counts as an installer stops being a guess about filenames.
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find app/tauri/target -type f -path "*/release/bundle/*" \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" \
               -o -name "*.AppImage" -o -name "*.deb" \) \
            -print0 | while IFS= read -r -d '' f; do
              cp "$f" out/
            done
          ls -lh out
          # An empty out/ means the bundle path changed. Fail here rather than let the upload
          # step report success on nothing.
          [ "$(ls -A out)" ] || { echo "no installers found under */release/bundle/"; exit 1; }

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: out/*
          fail_on_unmatched_files: true
