[package]
name = "genie1"
version = "0.2.0"
edition = "2021"
description = "Genie 1 — the chat as a real app"
authors = ["xEarn DAO"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# THE APP TALKS TO THE API FROM RUST, NOT FROM THE PAGE.
# A page served from tauri://localhost that calls fetch("/api/…") resolves it against
# tauri://localhost — there is no such route in the bundle, so every call 404s. Pointing the
# same fetch at https://xearn.com instead only moves the failure: verified 2026-09-06, the API
# returns no access-control-allow-origin header for any origin, so the browser blocks it.
#
# Going out through Rust has no CORS at all — it is not a browser request. It also keeps the
# credentialed routes (the signer proxy) unreachable from any web page, which allowlisting an
# origin would not.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# THE WALLET HANDOFF. A wallet extension injects window.ethereum into a browser TAB; this app's
# webview is not a tab and never gets it, so a Connect button in the window can only ever be
# decoration. The app opens the real browser instead, the extension does its job there, and the
# address comes back through a genie1:// link — which needs the app registered as the handler.
tauri-plugin-deep-link = "2"

# ONE APP, ONE WINDOW. Without this a genie1:// link LAUNCHES A SECOND COPY instead of waking
# the running one — measured 2026-09-06: firing the return link started pid B while pid A sat
# there waiting for it, so the address arrived in a window nobody was looking at. On Windows and
# Linux the deep-link plugin cannot work at all without it.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
opt-level = "z"      # a chat window does not need speed, it needs to be small
lto = true
codegen-units = 1
strip = true
panic = "abort"
